<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Stall Inventory</title>
    <style>
      :root {
        --page-bg: #eaf0f8;
        --sidebar-bg: #edf2fb;
        --card: #ffffff;
        --primary: #4f5ce8;
        --primary-dark: #2d3cc6;
        --text: #1f2a3d;
        --muted: #66738a;
        --line: #dfe7f3;
        --pill: #f3f6ff;
        --green: #1ea97d;
        --shadow: 0 16px 32px rgba(49, 69, 110, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: var(--page-bg);
        color: var(--text);
      }

      .app-shell {
        display: flex;
        min-height: 100vh;
        width: 100%;
      }

      .sidebar {
        width: 250px;
        background: rgba(233, 239, 249, 0.9);
        padding: 24px 18px 20px;
        border-right: 1px solid rgba(146, 164, 192, 0.4);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 12px rgba(79, 92, 232, 0.08);
        font-size: 22px;
      }

      .brand-text { line-height: 1.1; }
      .brand-text .top {
        display: block;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .brand-text .sub {
        display: block;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .nav-btn {
        background: transparent;
        border: none;
        border-radius: 12px;
        padding: 12px 12px 12px 14px;
        font-size: 18px;
        color: var(--text);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        text-align: left;
      }

      .nav-btn.active {
        background: linear-gradient(135deg, #4f5ce8, #525fe9);
        color: #fff;
        box-shadow: 0 10px 18px rgba(79, 92, 232, 0.18);
      }

      .nav-btn .icon {
        width: 22px;
        display: inline-flex;
        justify-content: center;
        font-size: 20px;
      }

      .main {
        flex: 1;
        padding: 28px 26px 24px;
      }

      .page-section {
        display: none;
      }

      .page-section.active {
        display: block;
      }

      .panel {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(146, 164, 192, 0.42);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .top-card {
        padding: 28px 26px 16px;
      }

      .header-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.04em;
        font-weight: 800;
      }

      .subhead {
        margin-top: 10px;
        margin-bottom: 24px;
        color: var(--muted);
        font-size: 15px;
      }

      .date-pill {
        background: var(--pill);
        border: 1px solid rgba(99, 110, 228, 0.2);
        border-radius: 16px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--primary-dark);
        font-weight: 700;
        min-width: 170px;
        justify-content: center;
      }

      .date-pill .small { font-size: 13px; }
      .date-pill .strong { font-size: 15px; }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        height: 52px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        padding: 0 14px;
        font-size: 16px;
        color: var(--text);
        outline: none;
      }

      .field textarea {
        min-height: 110px;
        height: auto;
        resize: vertical;
        padding: 12px 14px;
      }

      .field .with-icon {
        display: flex;
        align-items: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 12px;
      }

      .field .with-icon span {
        font-size: 20px;
        margin-right: 10px;
        color: var(--muted);
      }

      .field .with-icon input,
      .field .with-icon select,
      .field .with-icon textarea {
        border: none;
        background: transparent;
        height: 52px;
        padding: 0;
        box-shadow: none;
      }

      .field .with-icon textarea {
        min-height: 110px;
        height: auto;
        padding: 12px 0;
      }

      .book-summary {
        display: grid;
        grid-template-columns: 1.7fr 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 18px;
      }

      .summary-box {
        background: #f2f5ff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 12px;
        min-height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .summary-box .label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
      }
      .summary-box .value {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .summary-box .value.green { color: var(--green); }
      .summary-box .value.dark { color: var(--text); }
      .summary-box .value.small { font-size: 18px; }
      .summary-box .icon-wrap {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: rgba(56, 99, 254, 0.08);
        font-size: 18px;
      }

      .bottom-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 22px;
      }

      .action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 20px;
      }

      .btn-reset {
        height: 52px;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--text);
        font-weight: 700;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
      }

      .btn-primary {
        height: 52px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #4f5ce8, #4c66ea);
        color: #fff;
        font-weight: 800;
        font-size: 16px;
        padding: 0 28px;
        cursor: pointer;
        min-width: 220px;
        box-shadow: 0 12px 20px rgba(79, 92, 232, 0.18);
      }

      .inventory-grid {
        display: grid;
        grid-template-columns: 1.8fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }

      .inventory-card,
      .stock-card {
        padding: 22px 20px 18px;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }

      .card-header h2 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.04em;
      }

      .small-badge {
        background: #eef2ff;
        color: var(--primary-dark);
        border-radius: 12px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .inventory-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .toolbar .mini-select,
      .toolbar .search,
      .toggle {
        height: 42px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .toolbar .mini-select { width: 180px; padding: 0 12px; }
      .toolbar .search {
        flex: 1;
        min-width: 180px;
        padding: 0 12px;
      }
      .toggle {
        padding: 0 14px;
        font-weight: 700;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 14px;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
      }

      th {
        color: var(--muted);
        font-weight: 700;
        font-size: 12px;
      }

      tbody tr:last-child td { border-bottom: none; }

      .stock-card .card-header h2 { font-size: 22px; }
      .stock-card .sub {
        color: var(--muted);
        margin: 4px 0 16px;
      }

      .stock-card .field { margin-bottom: 12px; }
      .stock-card .field input,
      .stock-card .field select { height: 46px; }

      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .stock-card .footer-actions {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .stock-card .secondary-action {
        flex: 1;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--text);
        font-weight: 700;
      }

      .stock-card .primary-action {
        flex: 1;
        height: 48px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #4f5ce8, #495fe8);
        color: #fff;
        font-weight: 800;
      }

      @media (max-width: 980px) {
        .sidebar { display: none; }
        .form-grid, .book-summary, .inventory-grid, .row2, .bottom-row {
          grid-template-columns: 1fr;
        }
        .header-row, .action-row, .inventory-meta, .card-header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">📚</div>
          <div class="brand-text">
            <span class="top">Classroom Conversations</span>
            <span class="sub">Book Stall</span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-btn active"><span class="icon">📒</span>Record Transactions</button>
          <button class="nav-btn"><span class="icon">📊</span>Inventory</button>
          <button class="nav-btn"><span class="icon">📦</span>Add Stock</button>
        </nav>
      </aside>

      <main class="main">
        <section id="page-record" class="page-section active">
          <div class="panel top-card">
            <div class="header-row">
              <div>
                <h1>Record Transactions</h1>
                <div class="subhead">Save a sale entry for the selected book and stock owner.</div>
              </div>
              <div class="date-pill">
                <span class="small">📅</span>
                <span class="small">Today</span>
                <span class="strong" id="todayLabel">—</span>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <label>Transaction Type</label>
                <div class="with-icon">
                  <span>📦</span>
                  <input type="text" value="Sale" readonly />
                </div>
              </div>

              <div class="field">
                <label>Event Location</label>
                <div class="with-icon">
                  <span>📍</span>
                  <input id="eventLocation" type="text" placeholder="Enter event location" />
                </div>
              </div>

              <div class="field">
                <label>Event Date</label>
                <div class="with-icon">
                  <span>📅</span>
                  <input id="eventDate" type="date" />
                </div>
              </div>
            </div>

            <div class="bottom-row" style="margin-top: 22px;">
              <div class="field">
                <label>Book</label>
                <div class="with-icon">
                  <span>📖</span>
                  <select id="bookSelect"></select>
                </div>
              </div>

              <div class="field">
                <label>Volunteer</label>
                <div class="with-icon">
                  <span>👤</span>
                  <select id="volunteerSelect"></select>
                </div>
              </div>
            </div>

            <div class="bottom-row" style="margin-top: 8px;">
              <div class="field">
                <label>Stock Owner</label>
                <div class="with-icon">
                  <span>👤</span>
                  <select id="stockOwnerSelect"></select>
                </div>
              </div>

              <div class="field">
                <label>Recorded By</label>
                <div class="with-icon">
                  <span>👤</span>
                  <input id="recordedByInput" type="text" placeholder="Enter recorder name" />
                </div>
              </div>
            </div>

            <div class="bottom-row" style="margin-top: 8px;">
              <div class="field">
                <label>Quantity</label>
                <div class="with-icon">
                  <span>#</span>
                  <input id="quantityInput" type="number" min="1" value="2" />
                </div>
              </div>

              <div class="field">
                <label>Amount</label>
                <div class="with-icon">
                  <span>₹</span>
                  <input id="amountInput" type="number" min="0" step="0.01" value="0" placeholder="Enter selling amount" />
                </div>
              </div>
            </div>

            <div class="field" style="margin-top: 18px;">
              <label>Notes</label>
              <div class="with-icon" style="align-items: flex-start; padding: 0 12px;">
                <span style="align-self: flex-start; margin-top: 12px;">📝</span>
                <textarea id="notesInput" rows="3" placeholder="Enter any extra note for this transaction"></textarea>
              </div>
            </div>

            <div class="action-row">
              <button class="btn-reset" id="resetTransactionBtn" type="button">⟳ Reset</button>
              <button class="btn-primary" id="saveTransactionBtn" type="button">💾 Save Transaction</button>
            </div>
          </div>
        </section>

        <section id="page-inventory" class="page-section">
          <div class="panel inventory-card">
            <div class="card-header">
              <h2>Inventory</h2>
              <div class="small-badge">📦 Total Stock<br /><strong style="font-size: 28px;" id="inventoryTotalLabel">0</strong></div>
            </div>

            <div class="inventory-meta">
              <div class="toolbar" style="flex: 1;">
                <select id="inventoryOwnerFilter" class="mini-select">
                  <option value="">All Stock Owners</option>
                </select>
                <input id="inventorySearch" class="search" type="text" placeholder="Search by book title..." />
              </div>
              <button class="toggle" id="showActiveBtn" type="button">Show Active</button>
            </div>

            <table id="inventoryTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Book Name</th>
                  <th>Quantity</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section id="page-stock" class="page-section">
          <div class="panel stock-card">
            <div class="card-header">
              <div>
                <div class="brand-mark" style="width: 36px; height: 36px; font-size: 20px; margin-bottom: 8px;">📚</div>
                <h2>Add Stock</h2>
              </div>
            </div>

            <div class="sub">Add new stock to a stock owner's inventory.</div>

            <div class="field">
              <label>Book</label>
              <select id="stockBookSelect"></select>
            </div>

            <div class="row2">
              <div class="field">
                <label>Stock Owner</label>
                <select id="stockOwnerAddSelect"></select>
              </div>

              <div class="field">
                <label>Quantity</label>
                <input id="stockQuantityInput" type="number" min="1" value="10" />
              </div>
            </div>

            <div class="footer-actions">
              <button class="secondary-action" id="resetStockBtn" type="button">⟳ Reset</button>
              <button class="primary-action" id="addStockBtn" type="button">📦 Add Stock</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script>
      const appState = {
        books: [],
        volunteers: [],
        inventory: []
      };

      function formatCurrency(value) {
        const amount = Number(value || 0);
        return '₹ ' + amount.toLocaleString('en-IN');
      }

      function getBookName(item) {
        return item && (item.bookName || item.name || '');
      }

      function getVolunteerName(item) {
        return item && (item.name || item.volunteerName || '');
      }

      function getFieldValue(item, key) {
        if (item && item[key] !== undefined && item[key] !== null && String(item[key]).trim() !== '') {
          return item[key];
        }

        if (key === 'bookName' || key === 'name') {
          return item && (item.bookName || item.name || '');
        }

        return item && item[key] ? item[key] : '';
      }

      function populateSelect(selectId, items, valueKey, labelKey, emptyLabel) {
        const select = document.getElementById(selectId);
        if (!select) return;
        select.innerHTML = '';

        if (emptyLabel) {
          const emptyOption = document.createElement('option');
          emptyOption.value = '';
          emptyOption.textContent = emptyLabel;
          select.appendChild(emptyOption);
        }

        items.forEach((item) => {
          const option = document.createElement('option');
          const value = getFieldValue(item, valueKey);
          const label = getFieldValue(item, labelKey);
          option.value = value;
          option.textContent = label;
          select.appendChild(option);
        });
      }

      function formatTodayDate(date) {
        return new Date(date.getTime() - (date.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
      }

      function setTodayDate() {
        const today = new Date();
        const iso = formatTodayDate(today);
        const eventDateInput = document.getElementById('eventDate');
        if (eventDateInput) eventDateInput.value = iso;
        document.getElementById('todayLabel').textContent = today.toLocaleDateString('en-GB', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        });
      }

      function showPage(pageId) {
        document.querySelectorAll('.page-section').forEach((section) => {
          section.classList.toggle('active', section.id === pageId);
        });

        document.querySelectorAll('.nav-btn').forEach((button) => {
          const isActive = button.dataset.page === pageId;
          button.classList.toggle('active', isActive);
        });
      }

      function renderInventory(rows) {
        appState.inventory = rows || [];
        const tbody = document.querySelector('#inventoryTable tbody');
        tbody.innerHTML = '';

        const totalBooks = appState.inventory.reduce((sum, row) => sum + Number(row.quantity || 0), 0);
        const totalLabel = document.getElementById('inventoryTotalLabel');
        if (totalLabel) totalLabel.textContent = totalBooks;

        if (!appState.inventory.length) {
          const row = document.createElement('tr');
          row.innerHTML = '<td colspan="4">No inventory available.</td>';
          tbody.appendChild(row);
          return;
        }

        appState.inventory.forEach((row, index) => {
          const tr = document.createElement('tr');
          tr.dataset.book = row.bookName;
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${row.bookName}</td>
            <td>${row.quantity}</td>
          `;
          tbody.appendChild(tr);
        });

        const filterText = document.getElementById('inventorySearch').value.trim().toLowerCase();
        if (filterText) {
          const rowsToFilter = document.querySelectorAll('#inventoryTable tbody tr');
          rowsToFilter.forEach((row) => {
            const matches = (row.dataset.book || '').toLowerCase().includes(filterText);
            row.style.display = matches ? '' : 'none';
          });
        }
      }

      function loadInventory() {
        const owner = document.getElementById('inventoryOwnerFilter').value || '';
        google.script.run
          .withSuccessHandler(renderInventory)
          .withFailureHandler(() => renderInventory([]))
          .getInventoryByVolunteer(owner);
      }

      function updateTotalAmount() {
        const selectedBookName = document.getElementById('bookSelect').value;
        const selectedOwner = document.getElementById('stockOwnerSelect').value || '';
        const stockCountEl = document.getElementById('stockCount');

        if (!selectedOwner) {
          if (stockCountEl) stockCountEl.textContent = '0';
          return;
        }

        google.script.run
          .withSuccessHandler((rows) => {
            const match = (rows || []).find((row) => row.bookName === selectedBookName && row.volunteerName === selectedOwner);
            const available = match ? Number(match.quantity || 0) : 0;
            if (stockCountEl) stockCountEl.textContent = available;
          })
          .withFailureHandler(() => {
            if (stockCountEl) stockCountEl.textContent = '0';
          })
          .getInventoryByVolunteer(selectedOwner);
      }

      function showMessage(text, isSuccess = true) {
        const banner = document.createElement('div');
        banner.style.marginTop = '16px';
        banner.style.padding = '10px 14px';
        banner.style.borderRadius = '12px';
        banner.style.fontWeight = '700';
        banner.style.fontSize = '14px';
        banner.style.background = isSuccess ? '#ecfdf5' : '#fef2f2';
        banner.style.color = isSuccess ? '#065f46' : '#b91c1c';
        banner.style.border = '1px solid ' + (isSuccess ? '#bbf7d0' : '#fecaca');
        banner.textContent = text;

        const activePage = document.querySelector('.page-section.active');
        const root = activePage || document.querySelector('.main') || document.body;
        const existing = root.querySelector('.js-message');
        if (existing) existing.remove();

        root.appendChild(banner);
        banner.classList.add('js-message');
      }

      function bindEvents() {
        document.querySelectorAll('.nav-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const pageId = button.dataset.page;
            showPage(pageId);
          });
        });

        const bookSelect = document.getElementById('bookSelect');
        const stockOwnerSelect = document.getElementById('stockOwnerSelect');
        const quantityInput = document.getElementById('quantityInput');
        const amountInput = document.getElementById('amountInput');

        if (bookSelect) bookSelect.addEventListener('change', updateTotalAmount);
        if (stockOwnerSelect) stockOwnerSelect.addEventListener('change', updateTotalAmount);
        if (quantityInput) quantityInput.addEventListener('input', updateTotalAmount);
        if (amountInput) amountInput.addEventListener('input', updateTotalAmount);

        document.getElementById('saveTransactionBtn').addEventListener('click', () => {
          const selectedBookName = document.getElementById('bookSelect').value;
          const payload = {
            bookName: selectedBookName,
            eventLocation: document.getElementById('eventLocation').value,
            eventDate: document.getElementById('eventDate').value,
            sellerName: document.getElementById('volunteerSelect').value,
            stockOwnerName: document.getElementById('stockOwnerSelect').value,
            quantity: document.getElementById('quantityInput').value,
            unitPrice: Number(document.getElementById('amountInput').value || 0),
            recordedBy: document.getElementById('recordedByInput').value,
            notes: document.getElementById('notesInput').value
          };

          google.script.run
            .withSuccessHandler((result) => {
              showMessage(result.message || 'Transaction saved successfully.');
              document.getElementById('quantityInput').value = '1';
              document.getElementById('notesInput').value = '';
              updateTotalAmount();
              loadInventory();
            })
            .withFailureHandler((error) => {
              showMessage(error.message || 'Unable to save transaction.', false);
            })
            .recordSale(payload);
        });

        document.getElementById('resetTransactionBtn').addEventListener('click', () => {
          setTodayDate();
          document.getElementById('eventLocation').value = '';
          document.getElementById('bookSelect').selectedIndex = 0;
          document.getElementById('volunteerSelect').selectedIndex = 0;
          document.getElementById('stockOwnerSelect').selectedIndex = 0;
          document.getElementById('quantityInput').value = '2';
          document.getElementById('amountInput').value = '0';
          document.getElementById('recordedByInput').value = '';
          document.getElementById('notesInput').value = '';
          updateTotalAmount();
        });

        document.getElementById('inventorySearch').addEventListener('input', () => {
          const query = document.getElementById('inventorySearch').value.trim().toLowerCase();
          const rows = document.querySelectorAll('#inventoryTable tbody tr');
          rows.forEach((row) => {
            const text = (row.dataset.book || '').toLowerCase();
            row.style.display = text.includes(query) ? '' : 'none';
          });
        });

        document.getElementById('inventoryOwnerFilter').addEventListener('change', loadInventory);

        document.getElementById('showActiveBtn').addEventListener('click', () => {
          const btn = document.getElementById('showActiveBtn');
          const active = btn.dataset.active === 'true';
          btn.dataset.active = (!active).toString();
          btn.textContent = active ? 'Show Active' : 'Show All';
        });

        document.getElementById('resetStockBtn').addEventListener('click', () => {
          document.getElementById('stockBookSelect').selectedIndex = 0;
          document.getElementById('stockOwnerAddSelect').selectedIndex = 0;
          document.getElementById('stockQuantityInput').value = '10';
        });

        document.getElementById('addStockBtn').addEventListener('click', () => {
          const payload = {
            bookName: document.getElementById('stockBookSelect').value,
            volunteerName: document.getElementById('stockOwnerAddSelect').value,
            quantityReceived: document.getElementById('stockQuantityInput').value
          };

          google.script.run
            .withSuccessHandler((result) => {
              showMessage(result.message || 'Stock added successfully.');
              loadInventory();
            })
            .withFailureHandler((error) => {
              showMessage(error.message || 'Unable to add stock.', false);
            })
            .addStock(payload);
        });
      }

      function loadLookupData() {
        google.script.run
          .withSuccessHandler((result) => {
            appState.books = result.books || [];
            appState.volunteers = result.volunteers || [];

            populateSelect('bookSelect', appState.books, 'bookName', 'bookName', '');
            populateSelect('stockBookSelect', appState.books, 'bookName', 'bookName', '');
            populateSelect('volunteerSelect', appState.volunteers, 'name', 'name', '');
            populateSelect('stockOwnerSelect', appState.volunteers, 'name', 'name', '');
            populateSelect('stockOwnerAddSelect', appState.volunteers, 'name', 'name', '');
            populateSelect('inventoryOwnerFilter', appState.volunteers, 'name', 'name', 'All Stock Owners');

            if (appState.books.length) {
              const firstBook = getBookName(appState.books[0]);
              document.getElementById('bookSelect').value = firstBook;
              document.getElementById('stockBookSelect').value = firstBook;
            }

            if (appState.volunteers.length) {
              const firstVolunteer = getVolunteerName(appState.volunteers[0]);
              document.getElementById('volunteerSelect').value = firstVolunteer;
              document.getElementById('stockOwnerSelect').value = firstVolunteer;
              document.getElementById('stockOwnerAddSelect').value = firstVolunteer;
              document.getElementById('recordedByInput').value = firstVolunteer;
            }

            setTodayDate();
            bindEvents();
            loadInventory();
            updateTotalAmount();
          })
          .getLookupData();
      }

      document.querySelectorAll('.nav-btn').forEach((button) => {
        button.dataset.page = button.textContent.includes('Inventory') ? 'page-inventory' : button.textContent.includes('Add Stock') ? 'page-stock' : 'page-record';
      });

      loadLookupData();
    </script>
  </body>
</html>

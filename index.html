<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --bg-1: #eef4ff;
        --bg-2: #f8fafc;
        --card: rgba(255, 255, 255, 0.96);
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --primary-soft: #eef2ff;
        --text: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --shadow: rgba(15, 23, 42, 0.12);
        --success-bg: #ecfdf5;
        --success-text: #065f46;
        --error-bg: #fef2f2;
        --error-text: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 18px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(79, 70, 229, 0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.12), transparent 24%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        color: var(--text);
      }

      .card {
        width: 100%;
        max-width: 820px;
        background: var(--card);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 24px;
        padding: 28px 28px 22px;
        box-shadow: 0 18px 45px var(--shadow);
        backdrop-filter: blur(10px);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 8px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 7px 12px;
        background: var(--primary-soft);
        color: var(--primary-dark);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h2 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.6rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 8px 0 26px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .section {
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }

      .section h3 {
        margin: 0 0 4px;
        font-size: 1.2rem;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin: 18px 0 20px;
      }

      .tab-button {
        flex: 1;
        margin: 0;
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: #f8fafc;
        color: var(--muted);
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: none;
      }

      .inventory-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 0.92rem;
      }

      .inventory-table th,
      .inventory-table td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      .inventory-table th {
        background: #f8fafc;
        color: var(--muted);
        font-weight: 700;
      }

      .tab-button.active {
        background: var(--primary-soft);
        color: var(--primary-dark);
        border-color: rgba(79, 70, 229, 0.18);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      form {
        display: block;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 4px;
      }

      label {
        display: block;
        margin-top: 18px;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.01em;
      }

      input,
      select,
      button {
        width: 100%;
        margin-top: 8px;
        padding: 13px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 0.97rem;
        color: var(--text);
        outline: none;
        transition: all 0.2s ease;
      }

      input::placeholder {
        color: #94a3b8;
      }

      input:focus,
      select:focus {
        border-color: rgba(79, 70, 229, 0.7);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      button {
        margin-top: 28px;
        background: linear-gradient(135deg, var(--primary), #6366f1);
        color: white;
        border: none;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 10px 18px rgba(79, 70, 229, 0.22);
      }

      .secondary {
        background: linear-gradient(135deg, #0f766e, #14b8a6);
        box-shadow: 0 10px 18px rgba(20, 184, 166, 0.18);
      }

      button:hover {
        background: linear-gradient(135deg, var(--primary-dark), #4f46e5);
        transform: translateY(-1px);
      }

      .secondary:hover {
        background: linear-gradient(135deg, #115e59, #0f766e);
      }

      button:active {
        transform: translateY(0);
      }

      .message {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        display: none;
        font-size: 0.92rem;
        font-weight: 600;
      }

      .success {
        display: block;
        background: var(--success-bg);
        color: var(--success-text);
        border: 1px solid rgba(16, 185, 129, 0.14);
      }

      .error {
        display: block;
        background: var(--error-bg);
        color: var(--error-text);
        border: 1px solid rgba(239, 68, 68, 0.12);
      }

      @media (max-width: 640px) {
        .card {
          padding: 22px 18px 18px;
        }

        .header {
          display: block;
        }

        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div>
          <span class="badge">Book Stall</span>
        </div>
      </div>
      <h2>Inventory Entry</h2>
      <p class="subtitle">Record a sale for the next event with clean stock tracking.</p>

      <div class="tabs" role="tablist" aria-label="Inventory tabs">
        <button type="button" class="tab-button active" data-tab="salesTab">Sales</button>
        <button type="button" class="tab-button" data-tab="stockTab">Add Stock</button>
        <button type="button" class="tab-button" data-tab="inventoryTab">Inventory</button>
      </div>

      <div id="salesTab" class="tab-panel active">
        <form id="saleForm">
          <div class="row">
            <div>
              <label>Book
                <select id="bookName" required></select>
              </label>
            </div>

            <div>
              <label>Event Location
                <input id="eventLocation" type="text" placeholder="Main Hall" required>
              </label>
            </div>
          </div>

          <div class="row">
            <div>
              <label>Volunteer
                <select id="sellerName" required></select>
              </label>
            </div>

            <div>
              <label>Stock Owner
                <select id="stockOwnerName" required></select>
              </label>
            </div>
          </div>

          <div class="row">
            <div>
              <label>Event Date
                <input id="eventDate" type="date" required>
              </label>
            </div>

            <div>
              <label>Quantity
                <input id="quantity" type="number" min="1" step="1" required>
              </label>
            </div>
          </div>

          <div class="row">
            <div>
              <label>Unit Price
                <input id="unitPrice" type="number" min="0" step="0.01" required>
              </label>
            </div>

            <div>
              <label>Recorded By
                <input id="recordedBy" type="text" required>
              </label>
            </div>
          </div>

          <button type="submit">Save Entry</button>
        </form>
      </div>

      <div id="stockTab" class="tab-panel">
        <div class="section">
          <h3>Add Stock</h3>
          <form id="stockForm">
            <div class="row">
              <div>
                <label>Book
                  <select id="stockBookName" required></select>
                </label>
              </div>

              <div>
                <label>Volunteer
                  <select id="stockVolunteerName" required></select>
                </label>
              </div>
            </div>

            <div class="row">
              <div>
                <label>Quantity Received
                  <input id="quantityReceived" type="number" min="1" step="1" required>
                </label>
              </div>
            </div>

            <button type="submit" class="secondary">Add Stock</button>
          </form>
        </div>
      </div>

      <div id="inventoryTab" class="tab-panel">
        <div class="section">
          <h3>Inventory</h3>

          <div class="row">
            <div>
              <label>Stock Owner
                <select id="inventoryOwnerFilter"></select>
              </label>
            </div>
          </div>

          <table class="inventory-table">
            <thead>
              <tr>
                <th>Stock Owner</th>
                <th>Book</th>
                <th>Available</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="messageBox" class="message"></div>
    </div>

    <script>
      function showMessage(text, type) {
        const box = document.getElementById('messageBox');
        box.textContent = text;
        box.className = 'message ' + type;
      }

      function populateSelect(selectId, items, valueKey, labelKey) {
        const select = document.getElementById(selectId);
        select.innerHTML = '';

        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = 'Select...';
        select.appendChild(emptyOption);

        items.forEach((item) => {
          const option = document.createElement('option');
          option.value = item[valueKey];
          option.textContent = item[labelKey];
          select.appendChild(option);
        });
      }

      function switchTab(tabId) {
        document.querySelectorAll('.tab-button').forEach((button) => {
          const isActive = button.dataset.tab === tabId;
          button.classList.toggle('active', isActive);
        });

        document.querySelectorAll('.tab-panel').forEach((panel) => {
          panel.classList.toggle('active', panel.id === tabId);
        });
      }

      function renderInventory(rows) {
        const tbody = document.getElementById('inventoryTableBody');
        tbody.innerHTML = '';

        if (!rows || rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">No inventory available.</td></tr>';
          return;
        }

        rows.forEach((row) => {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>' + row.volunteerName + '</td><td>' + row.bookName + '</td><td>' + row.quantity + '</td>';
          tbody.appendChild(tr);
        });
      }

      function loadInventory() {
        const stockOwnerName = document.getElementById('inventoryOwnerFilter')?.value || '';

        google.script.run
          .withSuccessHandler(renderInventory)
          .withFailureHandler(() => renderInventory([]))
          .getInventoryByVolunteer(stockOwnerName);
      }

      function loadLookupData() {
        google.script.run
          .withSuccessHandler((result) => {
            populateSelect('bookName', result.books, 'bookName', 'bookName');
            populateSelect('sellerName', result.volunteers, 'name', 'name');
            populateSelect('stockOwnerName', result.volunteers, 'name', 'name');
            populateSelect('stockBookName', result.books, 'bookName', 'bookName');
            populateSelect('stockVolunteerName', result.volunteers, 'name', 'name');

            const inventoryFilter = document.getElementById('inventoryOwnerFilter');
            inventoryFilter.innerHTML = '';

            const allOption = document.createElement('option');
            allOption.value = '';
            allOption.textContent = 'All stock owners';
            inventoryFilter.appendChild(allOption);

            result.volunteers.forEach((volunteer) => {
              const option = document.createElement('option');
              option.value = volunteer.name;
              option.textContent = volunteer.name;
              inventoryFilter.appendChild(option);
            });

            inventoryFilter.addEventListener('change', loadInventory);
            loadInventory();
          })
          .getLookupData();
      }

      document.querySelectorAll('.tab-button').forEach((button) => {
        button.addEventListener('click', function () {
          switchTab(button.dataset.tab);
        });
      });

      document.getElementById('saleForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const payload = {
          bookName: document.getElementById('bookName').value,
          eventLocation: document.getElementById('eventLocation').value,
          eventDate: document.getElementById('eventDate').value,
          sellerName: document.getElementById('sellerName').value,
          stockOwnerName: document.getElementById('stockOwnerName').value,
          quantity: document.getElementById('quantity').value,
          unitPrice: document.getElementById('unitPrice').value,
          recordedBy: document.getElementById('recordedBy').value
        };

        google.script.run
          .withSuccessHandler((result) => {
            showMessage(result.message, 'success');
            document.getElementById('saleForm').reset();
          })
          .withFailureHandler((error) => {
            showMessage(error.message, 'error');
          })
          .recordSale(payload);
      });

      document.getElementById('stockForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const payload = {
          bookName: document.getElementById('stockBookName').value,
          volunteerName: document.getElementById('stockVolunteerName').value,
          quantityReceived: document.getElementById('quantityReceived').value
        };

        google.script.run
          .withSuccessHandler((result) => {
            showMessage(result.message, 'success');
            document.getElementById('stockForm').reset();
          })
          .withFailureHandler((error) => {
            showMessage(error.message, 'error');
          })
          .addStock(payload);
      });

      loadLookupData();
    </script>
  </body>
</html>
